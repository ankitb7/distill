  slack:
    enabled: true
    backend: mcp            # "mcp" (Claude-mediated) | "token" (autonomous, requires token)
    # token: "${SLACK_USER_TOKEN}"   # uncomment for token backend
    max_age_days: 10        # only fetch messages from the last N days (token backend)
