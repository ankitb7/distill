[project]
name = "distill"
version = "0.1.0"
description = "AI article curation & weekly podcast generator"
readme = "README.md"
authors = [
    { name = "Ankit Borawake", email = "47322956+ankitb7@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "trafilatura>=2.0",
    "readability-lxml>=0.8",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=5.2.2",
    "fastapi>=0.129.0",
    "uvicorn>=0.40.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
    "edge-tts>=7.2.7",
    "notebooklm-py>=0.8.1",
    "slack-sdk>=3.40.1",
    "playwright>=1.58.0",
]

[project.scripts]
distill = "distill.cli:app"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
]
