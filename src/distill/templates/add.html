{% extends "base.html" %}
{% block title %}Add Links — Distill{% endblock %}
{% block content %}
<div class="page-header">
    <span class="eyebrow">Curate directly</span>
    <h1>Add links</h1>
    <p>Drop one URL per line. Content will be fetched and extracted automatically.</p>
</div>

<form class="panel" hx-post="/add" hx-target="#results" hx-swap="innerHTML" hx-indicator="#spinner">
    <label for="article-urls">Article URLs</label>
    <textarea id="article-urls" name="urls" rows="5" placeholder="https://example.com/great-ai-article
https://another.com/llm-deep-dive
https://blog.example.com/practical-rag-guide" style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;"></textarea>
    <div class="btn-row">
        <button type="submit">Add and extract</button>
        <span id="spinner" class="htmx-indicator form-help" role="status">Fetching and extracting…</span>
    </div>
</form>

<div id="results" style="margin-top: 1.5rem;" aria-live="polite">
    {% include "_add_results.html" %}
</div>
{% endblock %}
